<body class="auth-page dashboard-page people-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="top auth-top">
    <div class="wrap top-inner">
      <a class="logo" href="home.html">synodos</a>
      <button type="button" class="btn btn-ghost top-menu-toggle" data-nav-toggle aria-controls="site-nav" aria-expanded="false" aria-label="Open menu" id="top-menu-toggle">
        <svg class="top-menu-toggle__bars" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav id="site-nav" class="top-nav" aria-label="Primary">
        <div class="top-actions">
          <button type="button" class="btn btn-ghost theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">
            <svg class="theme-toggle__icon theme-toggle__icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="theme-toggle__icon theme-toggle__icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <a class="btn btn-ghost" href="index.html" data-nav-group="guest">Home</a>
          <a class="btn btn-ghost" href="home.html" data-nav-group="user" hidden>Home</a>
          <div class="top-actions__auth-group" data-nav-group="guest" aria-label="Sign in options">
            <a class="btn btn-ghost" href="login.html">Log in</a>
            <a class="btn btn-primary" href="register.html">Get started</a>
          </div>
          <div class="top-actions__auth-group" data-nav-group="user" hidden aria-label="Your account">
            <a class="btn btn-ghost" href="dashboard.html">Projects</a>
            <a class="btn btn-ghost" href="messages.html">Messages</a>
            <a class="btn btn-ghost" href="profile.html">Your space</a>
            <button type="button" class="btn btn-ghost" data-nav-sign-out>Sign out</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="dashboard-main" id="main-content" tabindex="-1">
    <div class="wrap dashboard-wrap">
      <p id="people-msg" class="dashboard-msg" hidden></p>

      <section class="dashboard-section" aria-labelledby="people-title">
        <h1 id="people-title" class="dashboard-heading">Find people</h1>
        <p class="dashboard-lead">Search by username, display name, bio, or skill.</p>
        <div class="projects-toolbar" role="search">
          <label class="projects-toolbar__search">
            <span class="visually-hidden">Search people by username, display name, bio, or skill</span>
            <input type="search" id="people-search" class="projects-filter-input" placeholder="Skills, interests, or name" autocomplete="off" enterkeyhint="search" minlength="2">
          </label>
        </div>
        <div id="people-results" class="projects-grid"></div>
        <p id="people-empty" class="dashboard-empty" hidden>Type at least 2 characters to search.</p>
      </section>
    </div>
  </main>

  <footer class="auth-footer-note">
    <div class="wrap">
      <nav class="footer-nav" aria-label="Site pages">
        <a href="index.html">Home</a>
        <span class="footer-nav__cluster" data-nav-group="guest">
          <a href="login.html">Log in</a>
          <a href="register.html">Get started</a>
        </span>
        <span class="footer-nav__cluster" data-nav-group="user" hidden>
          <a href="home.html">Home</a>
          <a href="dashboard.html">Projects</a>
          <a href="messages.html">Messages</a>
          <a href="profile.html">Your space</a>
        </span>
      </nav>
      <p class="footer-credit">synodos</p>
    </div>
  </footer>

  <script src="js/netlify-api-base.js" defer></script>
  <script src="js/global-errors.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/notification-helpers.js" defer></script>
  <script src="js/public-nav.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/site-nav.js" defer></script>
  <script src="js/ui-empty-state.js" defer></script>
  <script src="js/user-badges.js" defer></script>
  <script src="js/people-page.js" defer></script>
</body>
</html>
