# Static site in `web/`. Writes `js/netlify-api-base.js` from env SYNODOS_API_BASE.
# base = "web" so the build matches `node scripts/...` even if the UI base directory is `web`.
[build]
  base = "web"
  command = "node scripts/write-netlify-api-base.js"
  publish = "."

# SYNODOS_API_BASE is meant to ship in client JS. If it is flagged "secret" in
# Netlify, the deploy scanner blocks the build unless this path is omitted.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "web/js/netlify-api-base.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
