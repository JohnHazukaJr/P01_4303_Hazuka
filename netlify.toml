# Static site in `web/`. Writes `js/netlify-api-base.js` from env SYNODOS_API_BASE.
# base = "web" so the build matches `node scripts/...` even if the UI base directory is `web`.
[build]
  base = "web"
  command = "node scripts/write-netlify-api-base.js"
  publish = "."

# Omit generated API base file (scanner uses paths under base = web/, e.g. js/...).
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "js/netlify-api-base.js,web/js/netlify-api-base.js,**/netlify-api-base.js"
  SECRETS_SCAN_OMIT_KEYS = "SYNODOS_API_BASE"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
