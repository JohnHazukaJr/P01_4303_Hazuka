<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to Synodos — connect with collaborators and projects.">
  <title>Sign in — Synodos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="top auth-top">
    <div class="wrap top-inner">
      <a class="logo" href="index.html">Synodos</a>
      <a class="btn btn-ghost" href="index.html">Back to home</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="wrap auth-wrap">
      <div class="auth-card">
        <p class="auth-eyebrow">Welcome back</p>
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-lead">
          Use your Synodos account. With the Node server running (<code>npm start</code> in <code>server/</code>), sign-in calls the API.
        </p>

        <form class="auth-form" id="login-form" action="#" method="post" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required
              placeholder="you@example.edu"
            >
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
              minlength="8"
            >
          </div>
          <div class="field-row">
            <label class="checkbox">
              <input type="checkbox" name="remember" value="1">
              <span>Keep me signed in</span>
            </label>
            <a class="auth-link" href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <p class="auth-footer">
          New to Synodos?
          <a href="index.html#join">Join the waitlist</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="auth-footer-note">
    <div class="wrap">
      <p>Synodos · P01_4303_Hazuka</p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
