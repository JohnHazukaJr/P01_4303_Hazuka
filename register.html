<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a Synodos account.">
  <title>Register — Synodos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="top auth-top">
    <div class="wrap top-inner">
      <a class="logo" href="index.html">Synodos</a>
      <nav class="top-nav" aria-label="Primary">
        <div class="top-actions">
          <button type="button" class="btn btn-ghost theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">
            <svg class="theme-toggle__icon theme-toggle__icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="theme-toggle__icon theme-toggle__icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <a class="btn btn-ghost" href="index.html">Back to home</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-main" id="main-content" tabindex="-1">
    <div class="wrap auth-wrap">
      <div class="auth-card">
        <p class="auth-eyebrow">Join Synodos</p>
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-lead">
          Use a real-looking email and a password of at least 8 characters. Data is stored locally in <code>server/data/</code>.
        </p>

        <form class="auth-form" id="register-form" action="#" method="post" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.edu"
            >
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              placeholder="••••••••"
              minlength="8"
            >
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-footer">
          Already have an account?
          <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="auth-footer-note">
    <div class="wrap">
      <nav class="footer-nav" aria-label="Site pages">
        <a href="index.html">Home</a>
        <a href="login.html">Log in</a>
        <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
      <p>Synodos · P01_4303_Hazuka</p>
    </div>
  </footer>

  <script src="js/auth.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/register.js" defer></script>
</body>
</html>
