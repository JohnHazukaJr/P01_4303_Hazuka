<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a Synodos account.">
  <title>Register — Synodos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="top auth-top">
    <div class="wrap top-inner">
      <a class="logo" href="index.html">Synodos</a>
      <a class="btn btn-ghost" href="index.html">Back to home</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="wrap auth-wrap">
      <div class="auth-card">
        <p class="auth-eyebrow">Join Synodos</p>
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-lead">
          Use a real-looking email and a password of at least 8 characters. Data is stored locally in <code>server/data/</code>.
        </p>

        <form class="auth-form" id="register-form" action="#" method="post" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.edu"
            >
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              placeholder="••••••••"
              minlength="8"
            >
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-footer">
          Already have an account?
          <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="auth-footer-note">
    <div class="wrap">
      <nav class="footer-nav" aria-label="Site pages">
        <a href="index.html">Home</a>
        <a href="login.html">Log in</a>
        <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
      <p>Synodos · P01_4303_Hazuka</p>
    </div>
  </footer>

  <script src="js/auth.js" defer></script>
  <script src="js/register.js" defer></script>
</body>
</html>
