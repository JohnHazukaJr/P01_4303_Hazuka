services:
  - type: web
    name: synodos-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: synodos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Optional: lock CORS down once you know your static origin.
      # - key: ALLOWED_ORIGINS
      #   value: https://synodos-web.onrender.com

  - type: web
    name: synodos-web
    env: static
    rootDir: web
    staticPublishPath: .

databases:
  - name: synodos-db
    databaseName: synodos
    plan: free

