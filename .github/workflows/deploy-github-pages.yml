# Enable in the repo: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Pushes to these branches publish the static site at the Pages URL shown in Settings → Pages.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, master, hazuka]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
