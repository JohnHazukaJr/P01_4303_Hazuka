# ── One-time GitHub setup (otherwise "configure-pages" fails with Not Found) ──
# 1. Repo → Settings → Pages
# 2. Under "Build and deployment" → Source: choose "GitHub Actions" (not "Deploy from a branch").
# 3. Save, then push again or use Actions → this workflow → "Run workflow".
#
# Docs: https://docs.github.com/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
#
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, master, hazuka]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
